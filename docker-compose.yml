services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: resume-builder-dev:local
    working_dir: /home/vscode/workspace
    volumes:
      - .:/home/vscode/workspace
    environment:
      - RESUME_REPO_ROOT=/home/vscode/workspace
      - DATABASE_URL=postgresql+asyncpg://resume:resume@postgres:5432/resume
    ports:
      - "3001:3001"
    init: true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=resume
      - POSTGRES_PASSWORD=resume
      - POSTGRES_DB=resume
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
